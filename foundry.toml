[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
solc = "0.8.36"
via_ir = true
evm_version = "shanghai"
revert_strings = "strip"
bytecode_hash = "none"
cbor_metadata = false
ignored_warnings_from = ["lib/"]
ignored_error_codes = [2424, 4591, 6335]
fs_permissions = [
    { access = "read", path = "./config" },
    { access = "read-write", path = "./out" },
    { access = "read-write", path = "./deployments" }
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
gnosis = "https://rpc.gnosischain.com"
chiado = "https://rpc.chiadochain.net"

[etherscan]
gnosis = { key = "${ETHERSCAN_KEY}", url = "https://api.gnosisscan.io/api" }
chiado = { key = "${ETHERSCAN_KEY}", url = "https://api-chiado.gnosisscan.io/api" }

[fmt]
line_length = 100
number_underscore = "thousands"
wrap_comments = true

[invariant]
runs = 64
depth = 64
