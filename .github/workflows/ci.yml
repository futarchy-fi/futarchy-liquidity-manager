name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      - name: Format
        run: forge fmt --check

      - name: Shell syntax guard
        run: bash -n tools/*.sh

      - name: Scope guard
        run: bash tools/check-scope.sh

      - name: API freeze guard
        run: bash tools/check-api-freeze.sh

      - name: Config schema guard
        run: |
          batch_args=()
          for file in config/safe-batch.example.json config/batches/*.example.json; do
            batch_args+=(--batch "$file")
          done
          bash tools/validate-configs.sh --allow-placeholders \
            --deploy config/gnosis.example.json \
            "${batch_args[@]}"

      - name: Batch template generation
        run: bash tools/check-batch-templates.sh

      - name: Readiness evidence guard
        run: bash tools/check-readiness-evidence.sh

      - name: Limited preflight guard
        run: bash tools/check-preflight-limited-deploy.sh

      - name: Test
        run: forge test

      - name: Coverage summary
        run: forge coverage --ir-minimum --report summary
