name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      - name: Format
        run: forge fmt --check

      - name: Scope guard
        run: bash tools/check-scope.sh

      - name: API freeze guard
        run: bash tools/check-api-freeze.sh

      - name: Config schema guard
        run: |
          bash tools/validate-configs.sh --allow-placeholders \
            --deploy config/gnosis.example.json \
            --batch config/safe-batch.example.json

      - name: Test
        run: forge test

      - name: Coverage summary
        run: forge coverage --report summary
