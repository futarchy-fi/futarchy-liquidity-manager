name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: stable

      - name: Build
        run: forge build

      - name: Format
        run: forge fmt --check

      - name: Shell syntax guard
        run: bash -n tools/*.sh

      - name: Scope guard
        run: bash tools/check-scope.sh

      - name: API freeze guard
        run: bash tools/check-api-freeze.sh

      - name: Config schema guard
        run: |
          batch_args=()
          for file in config/safe-batch.example.json config/batches/*.example.json; do
            batch_args+=(--batch "$file")
          done
          bash tools/validate-configs.sh --allow-placeholders \
            --deploy config/gnosis.example.json \
            --v4-factory config/mainnet-v4-factory.example.json \
            "${batch_args[@]}"

      - name: Batch template generation
        run: bash tools/check-batch-templates.sh

      - name: Readiness evidence guard
        run: bash tools/check-readiness-evidence.sh

      - name: Limited preflight guard
        run: bash tools/check-preflight-limited-deploy.sh

      - name: Test
        run: forge test

      - name: Coverage summary
        run: >-
          forge coverage --ir-minimum --report summary
          --no-match-test test_candidateCreationCodeHashesMatchMainnetManifest

  gnosis-operator-fork:
    runs-on: ubuntu-latest
    env:
      RUN_GNOSIS_FORK_TESTS: "true"
      GNOSIS_RPC_URL: ${{ secrets.GNOSIS_RPC_URL || 'https://rpc.gnosischain.com' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: stable

      - name: Gnosis operator-mode lifecycle fork
        run: >-
          forge test --match-path "test/fork/FlmOperatorLifecycleFork.t.sol" -vv
